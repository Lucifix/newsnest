<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Offline · NewsNest</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
         font: 16px/1.5 system-ui, sans-serif; background: #ffffff; color: #0a0a0c; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0c; color: #f4f4f6; } }
  h1 { font-size: 1.6rem; letter-spacing: -0.02em; margin: 14px 0 8px; }
  p { margin: 0 0 18px; color: #64646d; }
  button { font: inherit; font-weight: 700; padding: 10px 22px; border: 0; border-radius: 6px; background: #ff3da6; color: #0a0a0c; }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0a0a0c"/><g fill="none" stroke="#f4f4f6" stroke-width="3.6" stroke-linecap="round" transform="translate(16 16) scale(.8) translate(-16 -16)"><path d="M8.8 13.6A9.6 9.6 0 0 1 18.4 23.2"/><path d="M8.8 6.4A16.8 16.8 0 0 1 25.6 23.2"/></g><circle cx="10.24" cy="21.76" r="3.4" fill="#c6ff3d"/></svg>
    <h1>You're offline</h1>
    <p>NewsNest can't reach the server. Pages you opened recently still work.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
