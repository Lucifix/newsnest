# Publishes the project page in site/ to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "newsnest/static/fonts/**"
      - "newsnest/static/icons/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - run: sh site/build.sh _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
