# Publishes the project page in site/ and the read-only demo (demo/) to GitHub Pages.
# The demo is built from the app itself, so it is rebuilt when the app changes, and once a day to keep its dates current.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "newsnest/**"
      - "demo/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sh site/build.sh _site
      - run: python -m demo build _site/demo --base /newsnest/demo/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
